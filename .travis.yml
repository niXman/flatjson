dist: bionic
language: cpp
sudo: required
compiler:
  - gcc
  - clang
os:
  - linux
script:
  - cd $TRAVIS_BUILD_DIR
  - cmake -DCMAKE_BUILD_TYPE=Release .
  - cmake --build . --config Release
  - ./flatjson
  - eval $CXX -std=c++11 -O2 -UNDEBUG parsetest.cpp -o parsetest
  - ./parsetest assets/canada.json
  - ./parsetest assets/citm_catalog.json
  - ./parsetest assets/jeopardy.json
  - ./parsetest assets/twitter.json
